version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wifi-har-postgres
    environment:
      POSTGRES_USER: wifi_user
      POSTGRES_PASSWORD: wifi_pass
      POSTGRES_DB: wifi_har
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi_user -d wifi_har"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wifi-har-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wifi_user:wifi_pass@postgres:5432/wifi_har
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wifi-har-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"

volumes:
  pgdata:
